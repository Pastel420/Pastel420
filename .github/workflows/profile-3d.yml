# 3D 等距贡献图：每天生成并提交到本仓库 profile-3d-contrib/ 目录
# 放到 .github/workflows/profile-3d.yml
name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"      # UTC 18:00 = 北京时间次日 02:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # 彩虹渐变 + 逐格生长动画，配置来自 .github/3d-rainbow.json
          SETTING_JSON: .github/3d-rainbow.json

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then git push; fi
